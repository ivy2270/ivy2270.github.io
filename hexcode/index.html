<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>色碼即時預覽與複製工具</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .input-card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .input-header label {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-main);
    }

    .stats {
      font-size: 0.875rem;
      color: var(--text-muted);
      background: #f1f5f9;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
    }

    textarea {
      width: 100%;
      height: 110px;
      padding: 0.875rem;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-family: monospace, monospace;
      font-size: 0.95rem;
      color: var(--text-main);
      resize: vertical;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-main);
      font-weight: 500;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
    }

    .btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1.25rem;
    }

    .color-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .color-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .color-preview {
      height: 100px;
      width: 100%;
      position: relative;
      background-image: linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
                        linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
                        linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }

    .color-fill {
      width: 100%;
      height: 100%;
    }

    .color-info {
      padding: 0.875rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex-grow: 1;
      justify-content: space-between;
    }

    .color-codes {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .hex-val {
      font-family: monospace;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .rgb-val {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    .copy-btn {
      width: 100%;
      padding: 0.4rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #f8fafc;
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-top: 0.25rem;
    }

    .copy-btn:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .copy-btn.copied {
      background: #10b981 !important;
      color: #ffffff !important;
      border-color: #10b981 !important;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    @media (max-width: 480px) {
      .color-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 0.875rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎨 色碼即時預覽與複製工具</h1>
      <p>貼上多個 HEX 色碼（支援逗號、空格或換行分隔），即時呈現顏色與一鍵複製</p>
    </header>

    <div class="input-card">
      <div class="input-header">
        <label for="colorInput">輸入色碼區：</label>
        <span class="stats" id="colorCount">已解析 0 個顏色</span>
      </div>
      <textarea id="colorInput" placeholder="例如：&#10;#f8f9fb, #3b82f6, #ef4444&#10;#10b981 #8b5cf6 #f59e0b"></textarea>
      
      <div class="actions">
        <button class="btn" id="btnSample">帶入範例色碼</button>
        <button class="btn" id="btnClear">清空輸入</button>
      </div>
    </div>

    <div class="color-grid" id="colorGrid">
      <!-- 色碼卡片會動態生成於此 -->
    </div>
  </div>

  <script>
    const colorInput = document.getElementById('colorInput');
    const colorGrid = document.getElementById('colorGrid');
    const colorCount = document.getElementById('colorCount');
    const btnSample = document.getElementById('btnSample');
    const btnClear = document.getElementById('btnClear');

    // 預設範例資料
    const sampleColors = "#f8f9fb, #3b82f6, #ef4444\n#10b981, #8b5cf6, #f59e0b\n#ec4899, #14b8a6, #f97316";

    // 將 HEX 轉換為 RGB 格式
    function hexToRgb(hex) {
      let cleanHex = hex.replace('#', '');
      if (cleanHex.length === 3) {
        cleanHex = cleanHex.split('').map(char => char + char).join('');
      }
      if (cleanHex.length !== 6) return null;

      const num = parseInt(cleanHex, 16);
      const r = (num >> 16) & 255;
      const g = (num >> 8) & 255;
      const b = num & 255;
      return `rgb(${r}, ${g}, ${b})`;
    }

    // 解析文字中的所有 HEX 色碼
    function parseColorCodes(text) {
      // 正則表達式匹配 3 位數與 6 位數 HEX (自動剔除重複項)
      const hexRegex = /#?([0-9a-fA-F]{6}|[0-9a-fA-F]{3})\b/g;
      const matches = text.match(hexRegex) || [];
      
      const uniqueColors = [];
      matches.forEach(rawHex => {
        let formattedHex = rawHex.startsWith('#') ? rawHex : '#' + rawHex;
        let clean = formattedHex.replace('#', '');
        if (clean.length === 3) {
          clean = clean.split('').map(c => c + c).join('');
        }
        const standardHex = '#' + clean.toUpperCase();
        
        if (!uniqueColors.includes(standardHex)) {
          uniqueColors.push(standardHex);
        }
      });

      return uniqueColors;
    }

    // 渲染顏色卡片
    function renderColors() {
      const text = colorInput.value;
      const colors = parseColorCodes(text);

      colorCount.textContent = `已解析 ${colors.length} 個顏色`;
      colorGrid.innerHTML = '';

      if (colors.length === 0) {
        colorGrid.innerHTML = `
          <div class="empty-state">
            尚未檢測到有效的色碼，請在上方框內輸入（例如 #f8f9fb）
          </div>
        `;
        return;
      }

      colors.forEach(hex => {
        const rgb = hexToRgb(hex);

        const card = document.createElement('div');
        card.className = 'color-card';
        card.innerHTML = `
          <div class="color-preview">
            <div class="color-fill" style="background-color: ${hex};"></div>
          </div>
          <div class="color-info">
            <div class="color-codes">
              <span class="hex-val">${hex}</span>
              <span class="rgb-val">${rgb || ''}</span>
            </div>
            <button class="copy-btn" data-hex="${hex}">複製 HEX</button>
          </div>
        `;

        // 複製按鈕點擊事件
        const copyBtn = card.querySelector('.copy-btn');
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(hex).then(() => {
            const originalText = copyBtn.textContent;
            copyBtn.textContent = '已複製！';
            copyBtn.classList.add('copied');
            setTimeout(() => {
              copyBtn.textContent = originalText;
              copyBtn.classList.remove('copied');
            }, 1500);
          }).catch(err => {
            alert('複製失敗：' + err);
          });
        });

        colorGrid.appendChild(card);
      });
    }

    // 事件監聽
    colorInput.addEventListener('input', renderColors);

    btnSample.addEventListener('click', () => {
      colorInput.value = sampleColors;
      renderColors();
    });

    btnClear.addEventListener('click', () => {
      colorInput.value = '';
      renderColors();
    });

    // 初始載入範例資料
    colorInput.value = sampleColors;
    renderColors();
  </script>
</body>
</html>
